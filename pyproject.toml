[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "playhq-venue-tracker"
version = "0.1.0"
description = "Scrape public PlayHQ cricket fixtures across an association and generate venue availability matrices"
authors = [{ name = "PlayHQ Venue Tracker Team" }]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
playhq-venue-tracker = "playhq_venue_tracker.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["playhq_venue_tracker*"]
